name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          ref: ef496822ca427b4b000eaf7c78d3a570e23182e1
          submodules: recursive
          fetch-depth: 1

      - name: Check build environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare Homebrew Dependencies
        run: |
          brew install bison flex
          
          BISON_BIN="$(brew --prefix bison)/bin"
          FLEX_BIN="$(brew --prefix flex)/bin"
          
          echo "$BISON_BIN" >> "$GITHUB_PATH"
          echo "$FLEX_BIN" >> "$GITHUB_PATH"
          
          export PATH="$BISON_BIN:$FLEX_BIN:$PATH"
          bison --version
          flex --version

      - name: Build Madeira
        env:
          JOBS: 4
        run: |
          BISON_BIN="$(brew --prefix bison)/bin"
          FLEX_BIN="$(brew --prefix flex)/bin"
          export PATH="$BISON_BIN:$FLEX_BIN:$PATH"
          
          export BISON="$BISON_BIN/bison"
          export YACC="$BISON_BIN/bison -y"
          export LEX="$FLEX_BIN/flex"
          
          # THE FIX: Tell the linker to dynamically look up ONLY the 3 missing iOS functions 
          # without breaking the rest of the autotools configure script.
          export LDFLAGS="-Wl,-U,_ios_srcwatch_arm -Wl,-U,_ios_srcwatch_arm_geom -Wl,-U,_winios_dump_srcbits"
          
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      - name: Verify & Package IPA
        run: |
          test -s dist/Madeira.ipa
          echo "Build successful! File size:"
          ls -lh dist/Madeira.ipa
          shasum -a 256 dist/Madeira.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: dist/Madeira.ipa
          if-no-files-found: error
