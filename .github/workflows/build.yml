name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          ref: ef496822ca427b4b000eaf7c78d3a570e23182e1
          submodules: recursive
          fetch-depth: 1

      - name: Check build environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew --version

      - name: Prepare Homebrew tools
        run: |
          brew install bison
          export PATH="$(brew --prefix bison)/bin:$PATH"

          echo "Using bison:"
          which bison
          bison --version

      - name: Build Madeira
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          chmod +x scripts/build-ipa.sh
          JOBS=4 ./scripts/build-ipa.sh

      - name: Verify IPA
        run: |
          test -s dist/Madeira.ipa
          unzip -tq dist/Madeira.ipa
          shasum -a 256 dist/Madeira.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: dist/Madeira.ipa
