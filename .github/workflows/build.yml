name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          ref: ef496822ca427b4b000eaf7c78d3a570e23182e1
          submodules: recursive
          fetch-depth: 1

      - name: Check build environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare Homebrew Dependencies
        run: |
          # Install modern bison and flex
          brew install bison flex
          
          # Get actual paths (handles both /opt/homebrew and /usr/local)
          BISON_BIN="$(brew --prefix bison)/bin"
          FLEX_BIN="$(brew --prefix flex)/bin"
          
          # Persist to GitHub PATH for all subsequent steps
          echo "$BISON_BIN" >> "$GITHUB_PATH"
          echo "$FLEX_BIN" >> "$GITHUB_PATH"
          
          # Verify the correct versions are active
          export PATH="$BISON_BIN:$FLEX_BIN:$PATH"
          bison --version
          flex --version

      - name: Build Madeira
        env:
          JOBS: 4
        run: |
          # Re-declare paths locally to ensure the script's sub-shells inherit them
          BISON_BIN="$(brew --prefix bison)/bin"
          FLEX_BIN="$(brew --prefix flex)/bin"
          export PATH="$BISON_BIN:$FLEX_BIN:$PATH"
          
          # Force Wine autotools to use these exact binaries
          export BISON="$BISON_BIN/bison"
          export YACC="$BISON_BIN/bison -y"
          export LEX="$FLEX_BIN/flex"
          
          chmod +x scripts/build-ipa.sh
          
          # Execute the official build script
          ./scripts/build-ipa.sh

      - name: Verify & Package IPA
        run: |
          test -s dist/Madeira.ipa
          echo "Build successful! File size:"
          ls -lh dist/Madeira.ipa
          shasum -a 256 dist/Madeira.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: dist/Madeira.ipa
          if-no-files-found: error
