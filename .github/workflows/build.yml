name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout exact build source
        uses: actions/checkout@v4
        with:
          ref: ef496822ca427b4b000eaf7c78d3a570e23182e1
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build Madeira
        run: |
          chmod +x scripts/build-ipa.sh
          JOBS=4 ./scripts/build-ipa.sh

      - name: Verify IPA
        run: |
          test -s dist/Madeira.ipa
          unzip -tq dist/Madeira.ipa
          shasum -a 256 dist/Madeira.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-official-build
          path: |
            dist/Madeira.ipa
            BUILDING.md
