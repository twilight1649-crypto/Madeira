name: Build IPA (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show tool versions
        run: |
          xcodebuild -version
          sw_vers
          df -h /

      - name: Bring in the build script from PR 14
        run: |
          git config user.name ci
          git config user.email ci@example.com
          git fetch https://github.com/willfaust/Madeira.git pull/14/head:pr14
          git diff --name-only HEAD...pr14 | tee changed.txt
          if grep -Ev '^(scripts/|build/|BUILDING\.md$|README\.md$)' changed.txt; then
            echo "PR 14 changes unexpected files, stopping."
            exit 1
          fi
          git merge --no-edit pr14

      - name: Build the IPA
        run: ./scripts/build-ipa.sh

      - name: Save the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-ipa
          path: dist/Madeira.ipa
          if-no-files-found: error
          retention-days: 7
