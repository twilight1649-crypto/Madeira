name: Build Madeira IPA

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-14 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Fetch MSVC Runtime
        run: |
          cd tools
          # Note: Madeira requires you to get the MSVC runtime. 
          # You usually do this manually via tools/fetch-vcruntime.md
          # Depending on the repo state, you may need a script here to curl those DLLs.
          
      - name: Build Native Engines
        run: |
          # This runs the internal build scripts for Wine, FEX, etc.
          for script in build/*/build.sh; do
            bash "$script"
          done

      - name: Build iOS App via Xcode
        run: |
          # This uses the cloud Mac's Xcode to build the app
          xcodebuild -project Madeira.xcodeproj -scheme Madeira -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/Madeira.app Payload/
          zip -r Madeira.ipa Payload

      - name: Upload IPA for Download
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-App
          path: Madeira.ipa
