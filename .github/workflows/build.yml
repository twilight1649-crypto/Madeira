name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          ref: ef496822ca427b4b000eaf7c78d3a570e23182e1
          submodules: recursive
          fetch-depth: 1

      - name: Check build environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew --version

      - name: Prepare build tools and Bison
        run: |
          brew install bison flex

          BISON_BIN="$(brew --prefix bison)/bin"

          # 1. Inject Homebrew Bison into the runner's persistent PATH
          echo "$BISON_BIN" >> "$GITHUB_PATH"

          # 2. Create hard symlinks in standard directories so sub-shells never hit /usr/bin/bison
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$BISON_BIN/bison" /usr/local/bin/bison
          sudo ln -sf "$BISON_BIN/yacc" /usr/local/bin/yacc
          ln -sf "$BISON_BIN/bison" /opt/homebrew/bin/bison || true
          ln -sf "$BISON_BIN/yacc" /opt/homebrew/bin/yacc || true

          # 3. Verify that Bison 3.x+ is actively resolved
          export PATH="$BISON_BIN:$PATH"
          echo "Active bison location: $(which bison)"
          bison --version

      - name: Build Madeira
        env:
          JOBS: 4
        run: |
          BISON_BIN="$(brew --prefix bison)/bin"
          export PATH="$BISON_BIN:$PATH"
          export BISON="$BISON_BIN/bison"
          export YACC="$BISON_BIN/bison -y"

          echo "Target BISON binary: $BISON"
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      - name: Verify IPA
        run: |
          test -s dist/Madeira.ipa
          unzip -tq dist/Madeira.ipa
          shasum -a 256 dist/Madeira.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: dist/Madeira.ipa
          if-no-files-found: error
